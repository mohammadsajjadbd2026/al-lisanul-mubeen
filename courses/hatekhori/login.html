<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>প্রবেশ — আরবি ভাষার হাতেখড়ি</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--cr:#fbf6ec;--mr:#7a1f2b;--gd:#b8893b;--ink:#2b2220;--line:#ead9b8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  font-family:'Hind Siliguri',sans-serif;color:var(--ink);background:var(--cr);
  background-image:radial-gradient(circle at 20% 20%,rgba(184,137,59,.10),transparent 40%),radial-gradient(circle at 80% 80%,rgba(122,31,43,.08),transparent 40%)}
.box{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:34px 28px;text-align:center;
  box-shadow:0 10px 40px rgba(122,31,43,.12);border-top:6px solid var(--mr)}
.bis{font-family:'Amiri',serif;color:var(--gd);font-size:20px}
h1{font-family:'Noto Serif Bengali',serif;color:var(--mr);font-size:28px;margin:6px 0 2px}
.ar{font-family:'Amiri',serif;color:var(--gd);font-size:22px;margin-bottom:18px}
p{margin:0 0 18px;font-size:15px;color:#6b5a4a}
input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font-size:17px;font-family:inherit;outline:none;text-align:center}
input:focus{border-color:var(--gd)}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--mr);color:#fff;font-size:17px;font-family:inherit;font-weight:600;cursor:pointer}
button:hover{background:#651826}
.err{display:none;background:#fee2e2;color:#7f1d1d;border-radius:10px;padding:9px;margin-bottom:14px;font-size:15px}
.show .err{display:block}
.foot{margin-top:20px;font-size:13px;color:#a08a6a}
</style>
</head>
<body class="{{ERROR_CLASS}}">
<form class="box" method="post" action="/api/hatekhori/login">
  <div class="bis">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div>
  <h1>আরবি ভাষার হাতেখড়ি</h1>
  <div class="ar">مَدْخَلٌ إِلَى اللُّغَةِ الْعَرَبِيَّةِ</div>
  <p>কোর্সটি শুধু নিবন্ধিত শিক্ষার্থীদের জন্য। আপনাকে দেওয়া পাসওয়ার্ড লিখে প্রবেশ করুন।</p>
  <div class="err">পাসওয়ার্ডটি সঠিক নয়। আবার চেষ্টা করুন।</div>
  <input type="password" name="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required autofocus>
  <button type="submit">প্রবেশ করুন</button>
  <div class="foot">পাসওয়ার্ড না থাকলে কোর্স পরিচালকের সাথে যোগাযোগ করুন।</div>
</form>
</body>
</html>
